<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On! Project: Reaction Duel</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- google fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <!-- JavaScript link -->
    <!-- <script src="script.js" defer></script> -->
</head>
<body>
    <section class="title-screen">
        <h1>Reaction Duel</h1>
        <p>Think you're fast? Prove it.</p>
        <button>Start Game</button>
    </section>
    
    <section class="player1-screen">
        <h1>Reaction Duel</h1>
        <h2>Player 1's Turn</h2>
        <p>Wait...</p>
        <button>Click Me!</button>
    </section>

    <section class="player1-results">
        <h1>Reaction Duel</h1>
        <h2>Player 1's Time</h2>
        <p player1-time></p>
    </section>

    <section class="player2-screen">
        <h1>Reaction Duel</h1>
        <h2>Player 2's Turn</h2>
        <p>Wait...</p>
        <button>Click Me!</button>
    </section>

    <section class="player2-results">
        <h1>Reaction Duel</h1>
        <h2>Player 2's Time</h2>
        <p player2-time></p>
    </section>

    <section class="winner-screen">
        <p id="winner-msg"></p>
        <button>Play Again?</button>
    </section>
</body>
</html>
